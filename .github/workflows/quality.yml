name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/dashboard/package-lock.json
            workers/ab-router/package-lock.json
            workers/quiz/package-lock.json
            workers/nfse/package-lock.json
      - run: npm run install:all
      - run: npm run test
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
